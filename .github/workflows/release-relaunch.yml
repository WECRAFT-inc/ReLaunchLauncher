name: Release ReLaunch

# Construit l'installeur ReLaunch (version Electron) à chaque tag « relaunch-vX.Y.Z » (ou « relaunch-vX.Y.Z-rc.1 »).
# Les tags « v* » restent ceux de la version Python (release.yml) : les deux workflows ne se déclenchent jamais
# ensemble.
#
# RIEN n'est distribué automatiquement : la release du dépôt public est créée en BROUILLON. Ni la version Python
# ni ReLaunch ne voient un brouillon (elles lisent /releases/latest). La publier à la main sur GitHub la propose
# à TOUS les utilisateurs de WeCraft (version Python comprise : passage Python -> ReLaunch).
#
# Sécurité de la chaîne de publication (mêmes règles que release.yml) :
# - le nom du tag n'est jamais inséré directement dans un script (variables d'environnement) ;
# - typecheck et tests doivent réussir avant la compilation ;
# - la clé privée UPDATE_SIGNING_KEY n'est donnée qu'à l'étape « Signature » (npm et ses dépendances ne la
#   voient jamais) ; la signature est vérifiée avec la clé PUBLIQUE de la version Python ET de ReLaunch ;
# - une release déjà publiée n'est jamais modifiée.
# À FAIRE : épingler chaque action sur son SHA de commit complet (comme pour release.yml).
on:
  push:
    tags: ["relaunch-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
      HAS_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vérification du nom du tag et de la version
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^relaunch-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Nom de tag refusé : $TAG (attendu : relaunch-v2.0.0 ou relaunch-v2.0.0-rc.1)"; exit 1
          fi
          VERSION="${TAG#relaunch-v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # La version doit être plus récente que la version Python, sinon personne ne la recevrait.
          VERSION="$VERSION" python -c "import ast,os,re,sys; t=ast.parse(open('wecraft_launcher.py',encoding='utf-8').read()); py=next(ast.literal_eval(n.value) for n in t.body if isinstance(n,ast.Assign) and getattr(n.targets[0],'id','')=='APP_VERSION'); k=lambda v:[int(x) for x in re.findall(r'\d+',v.split('-')[0])]; v=os.environ['VERSION']; sys.exit(0 if k(v)>k(py) else f'Version {v} pas plus récente que la version Python {py}')"

      - name: Dépendances (versions verrouillées)
        working-directory: electron
        run: npm ci --no-audit --no-fund

      - name: Numéro de version = nom du tag
        working-directory: electron
        shell: bash
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Vérification des types (TypeScript strict)
        working-directory: electron
        run: npm run typecheck

      - name: Tests (bloquants)
        working-directory: electron
        run: npm test

      - name: Compilation de l'installeur
        working-directory: electron
        run: npm run dist:win

      - name: Nom et empreinte SHA-256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $name = "ReLaunch-Setup-$env:VERSION.exe"
          Copy-Item electron/release/ReLaunch-Setup.exe "out/$name"
          $h = (Get-FileHash "out/$name" -Algorithm SHA256).Hash.ToLower()
          "$h  $name" | Out-File "out/$name.sha256" -Encoding ascii
          "NAME=$name" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Clé de signature présente
        if: env.HAS_SIGNING_KEY != 'true'
        shell: bash
        run: |
          echo "Le secret UPDATE_SIGNING_KEY est absent : une release non signée serait refusée."
          exit 1

      - name: Outil de signature
        run: python -m pip install cryptography

      - name: Signature
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          python tools/sign_release.py sign "out/$env:NAME" "$env:VERSION" | Out-File "out/$env:NAME.sig" -Encoding ascii
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Les deux versions doivent accepter la signature : la version Python (passage vers ReLaunch) et ReLaunch.
      - name: Vérification de la signature (clés Python et ReLaunch)
        shell: pwsh
        run: |
          $py = python -c "import ast; t=ast.parse(open('wecraft_launcher.py',encoding='utf-8').read()); print(next(ast.literal_eval(n.value) for n in t.body if isinstance(n,ast.Assign) and getattr(n.targets[0],'id','')=='UPDATE_PUBLIC_KEY'))"
          $ts = (Select-String -Path electron/src/main/update/signature.ts -Pattern 'UPDATE_PUBLIC_KEY = "([^"]+)"').Matches[0].Groups[1].Value
          if ($py -ne $ts) { Write-Error "Clés publiques différentes entre Python et ReLaunch"; exit 1 }
          python tools/sign_release.py verify "out/$env:NAME" "$env:VERSION" "out/$env:NAME.sig" $py
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Installeur joint au run (essai direct)
        uses: actions/upload-artifact@v4
        with:
          name: ReLaunch-${{ env.VERSION }}
          path: out/
          retention-days: 14

      # Dépôt public : BROUILLON, sans « prerelease » (une prerelease n'est jamais proposée par /releases/latest,
      # donc la publier ne servirait à rien). Le publier à la main = le proposer à tous les utilisateurs.
      # RELEASES_TOKEN : jeton « fine-grained » limité au dépôt WeCraft-Releases, permission Contents: write.
      - name: Brouillon dans le dépôt public
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          RTAG="v$VERSION"
          PUB=Rexidelamort/WeCraft-Releases
          FILES="out/$NAME out/$NAME.sha256 out/$NAME.sig"
          HASH=$(cut -d' ' -f1 "out/$NAME.sha256")
          if gh release view "$RTAG" --repo "$PUB" --json isDraft --jq .isDraft >/tmp/draft 2>/dev/null; then
            if [ "$(cat /tmp/draft)" != "true" ]; then
              echo "La release $RTAG est déjà publiée dans $PUB : rien n'est modifié. Utilisez un nouveau tag."; exit 1
            fi
            gh release upload "$RTAG" $FILES --repo "$PUB" --clobber
            exit 0
          fi
          gh release create "$RTAG" $FILES --repo "$PUB" --draft \
            --title "ReLaunch $RTAG" --notes "ReLaunch $RTAG (nouvelle version de WeCraft) - SHA-256 : $HASH"
