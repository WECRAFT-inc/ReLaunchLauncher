name: Release WeCraft

# Construit WeCraft.exe à chaque tag « vX.Y.Z » (ou « vX.Y.Z-rc1 »).
# Rien n'est distribué aux utilisateurs automatiquement : la release du dépôt public est créée en
# BROUILLON. Le launcher ne voit que les releases publiées : il faut la publier à la main sur GitHub
# après avoir testé l'exe.
#
# Sécurité de la chaîne de publication :
# - le nom du tag n'est jamais inséré directement dans un script (variables d'environnement) ;
# - les tests doivent réussir avant la compilation ;
# - si le secret UPDATE_SIGNING_KEY existe, l'exe est signé (WeCraft.exe.sig, voir tools/sign_release.py).
# À FAIRE (impossible depuis l'environnement qui a préparé ce fichier) : épingler chaque action sur son
# SHA de commit complet (ex. actions/checkout@<sha40> # v4) ; Dependabot (.github/dependabot.yml) les
# tiendra ensuite à jour.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances de test
        run: python -m pip install -r requirements-build.txt
      - name: Tests (bloquants)
        run: python -m unittest discover -s tests -v

  build:
    needs: tests
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vérification du nom du tag
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Nom de tag refusé : $TAG (attendu : v1.2.3 ou v1.2.3-rc1)"; exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      # PyInstaller n'est PAS dans ce fichier : il est installé juste après (bootloader recompilé)
      - name: Dépendances
        run: python -m pip install -r requirements-build.txt

      # Le bootloader standard de PyInstaller est connu des antivirus (des malwares l'utilisent aussi).
      # On le recompile pour obtenir un exécutable de démarrage unique.
      # Si la compilation échoue, on retombe sur le PyInstaller standard pour ne pas bloquer la release.
      - name: PyInstaller (bootloader recompilé)
        shell: pwsh
        run: |
          $env:PYINSTALLER_COMPILE_BOOTLOADER = "1"
          python -m pip install --verbose --no-binary=PyInstaller PyInstaller
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Compilation du bootloader impossible : PyInstaller standard utilisé."
            Remove-Item Env:PYINSTALLER_COMPILE_BOOTLOADER
            python -m pip install --no-cache-dir PyInstaller
          }

      # Écrit APP_VERSION dans wecraft_launcher.py. Le dépôt des mises à jour (GITHUB_REPO) n'est PAS
      # modifié ici : il est fixé dans le code (Rexidelamort/WeCraft-Releases).
      - name: Numéro de version = nom du tag
        run: python set_version.py "$env:TAG"

      # Informations de version intégrées à l'exe (clic droit > Propriétés > Détails) :
      # un exe qui s'identifie est moins suspect pour les antivirus.
      - name: Informations de version de l'exe
        shell: python
        run: |
          import os, re
          tag = os.environ["TAG"]
          nums = [int(n) for n in (re.findall(r"\d+", tag) + ["0"] * 4)[:4]]
          dotted = ".".join(str(n) for n in nums[:3])
          owner = os.environ.get("GITHUB_REPOSITORY_OWNER", "WeCraft")
          content = f"""VSVersionInfo(
            ffi=FixedFileInfo(
              filevers={tuple(nums)}, prodvers={tuple(nums)},
              mask=0x3f, flags=0x0, OS=0x40004, fileType=0x1, subtype=0x0, date=(0, 0)),
            kids=[
              StringFileInfo([StringTable('040C04B0', [
                StringStruct('CompanyName', '{owner}'),
                StringStruct('FileDescription', 'WeCraft - lanceur d instances Minecraft'),
                StringStruct('FileVersion', '{dotted}'),
                StringStruct('InternalName', 'WeCraft'),
                StringStruct('LegalCopyright', 'Open source - github.com/{os.environ.get("GITHUB_REPOSITORY", "")}'),
                StringStruct('OriginalFilename', 'WeCraft.exe'),
                StringStruct('ProductName', 'WeCraft'),
                StringStruct('ProductVersion', '{dotted}')])]),
              VarFileInfo([VarStruct('Translation', [1036, 1200])])
            ])
          """
          open("version_info.txt", "w", encoding="utf-8").write(content)

      - name: Compilation de l'exe
        shell: pwsh
        run: |
          New-Item -ItemType File -Force fonts/.keep | Out-Null
          pyinstaller --onefile --windowed --noupx --version-file version_info.txt --icon assets/wecraft.ico --name WeCraft --add-data "assets;assets" --add-data "fonts;fonts" wecraft_launcher.py

      - name: Empreinte SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/WeCraft.exe -Algorithm SHA256).Hash.ToLower()
          "$h  WeCraft.exe" | Out-File dist/WeCraft.exe.sha256 -Encoding ascii

      - name: Signature (si le secret UPDATE_SIGNING_KEY est configuré)
        if: env.UPDATE_SIGNING_KEY != ''
        shell: pwsh
        run: |
          python tools/sign_release.py sign dist/WeCraft.exe "$env:VERSION" | Out-File dist/WeCraft.exe.sig -Encoding ascii
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Liste des fichiers de la release
        shell: bash
        run: |
          FILES="dist/WeCraft.exe dist/WeCraft.exe.sha256"
          [ -f dist/WeCraft.exe.sig ] && FILES="$FILES dist/WeCraft.exe.sig"
          echo "FILES=$FILES" >> "$GITHUB_ENV"

      # Archive dans le dépôt privé (invisible des utilisateurs).
      - name: Release dans le dépôt privé
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" $FILES --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes \
            $([[ "$VERSION" == *-* ]] && echo --prerelease)

      # Dépôt public : BROUILLON. Publiez-le à la main sur GitHub après avoir testé l'exe.
      # RELEASES_TOKEN : jeton « fine-grained » limité au dépôt WeCraft-Releases, permission Contents: write.
      - name: Brouillon dans le dépôt public
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          HASH=$(cut -d' ' -f1 dist/WeCraft.exe.sha256)
          gh release create "$TAG" $FILES --repo Rexidelamort/WeCraft-Releases --draft \
            --title "$TAG" --notes "WeCraft $TAG - SHA-256 : $HASH" \
            $([[ "$VERSION" == *-* ]] && echo --prerelease)
