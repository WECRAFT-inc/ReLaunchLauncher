name: Electron (compilation de contrôle)

# Lot E0 de la migration Electron : vérifie, compile et teste la version Electron sous Windows
# (installeur complet, par utilisateur, décision du 20/10/2026).
# RIEN n'est publié : pas de release, pas de secret, pas de signature. L'installeur produit est seulement
# joint au run (« artefact », 14 jours) pour être essayé en bac à sable.
on:
  push:
    branches: ["electron/**"]
  pull_request:
    paths: ["electron/**", ".github/workflows/electron.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Pas encore de package-lock.json : il est produit ici et joint au run, pour être relu puis
      # versionné. Ensuite, cette étape passera à « npm ci » (versions exactes et empreintes).
      - name: Dépendances
        run: npm install --no-audit --no-fund

      - name: Vérification des types (TypeScript strict)
        run: npm run typecheck

      - name: Tests (bloquants)
        run: npm test

      - name: Compilation de l'installeur (sans publication)
        run: npm run dist:win

      - name: Empreinte SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash release/WeCraft-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$h  WeCraft-Setup.exe" | Out-File release/WeCraft-Setup.exe.sha256 -Encoding ascii
          Get-Item release/WeCraft-Setup.exe | Select-Object Name, Length | Format-Table

      # Scénario complet sur la machine de la CI (jetable) : installation, raccourcis, démarrage,
      # relance de l'installeur comme le ferait un ancien raccourci, désinstallation.
      # Un faux launcher_config.json sert de témoin : il ne doit JAMAIS être modifié.
      - name: Installation, relance et désinstallation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Fail($msg) { Write-Error $msg; exit 1 }
          function Stop-WeCraft { Get-Process -Name WeCraft -ErrorAction SilentlyContinue | Stop-Process -Force; Start-Sleep 2 }

          $setup = (Resolve-Path release/WeCraft-Setup.exe).Path
          $cfgDir = Join-Path $env:APPDATA ".wecraft"
          New-Item -ItemType Directory -Force $cfgDir | Out-Null
          $cfg = Join-Path $cfgDir "launcher_config.json"
          '{"theme": "glace", "temoin": "ne pas modifier"}' | Out-File $cfg -Encoding utf8
          $cfgHash = (Get-FileHash $cfg).Hash

          # 1. Installation silencieuse (par utilisateur, sans droits administrateur)
          $p = Start-Process $setup -ArgumentList "/S" -PassThru -Wait
          if ($p.ExitCode -ne 0) { Fail "Installation : code $($p.ExitCode)" }
          $entry = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" |
            Where-Object { $_.DisplayName -like "WeCraft*" } | Select-Object -First 1
          if (-not $entry) { Fail "Aucune entrée de désinstallation trouvée (HKCU)" }
          $dir = $entry.InstallLocation
          if (-not $dir) { $dir = Join-Path $env:LOCALAPPDATA "Programs\WeCraft" }
          $exe = Join-Path $dir "WeCraft.exe"
          if (-not (Test-Path $exe)) { Fail "WeCraft.exe absent de $dir" }
          if (-not $dir.StartsWith($env:LOCALAPPDATA)) { Fail "Installé hors du profil utilisateur : $dir" }
          $desktop = Join-Path ([Environment]::GetFolderPath("Desktop")) "WeCraft.lnk"
          $menu = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\WeCraft.lnk"
          if (-not (Test-Path $desktop)) { Fail "Raccourci Bureau absent" }
          if (-not (Test-Path $menu)) { Fail "Raccourci menu Démarrer absent" }
          $stamp = (Get-Item $exe).LastWriteTimeUtc
          Write-Host "Installé : $dir (version $($entry.DisplayVersion)) ; raccourcis Bureau et menu Démarrer présents."

          # 2. L'application installée démarre et reste ouverte
          Stop-WeCraft
          $app = Start-Process $exe -PassThru
          Start-Sleep 12
          if ($app.HasExited) { Fail "L'application installée s'est arrêtée (code $($app.ExitCode))" }
          Stop-WeCraft
          Write-Host "Application installée : démarrée, toujours ouverte après 12 s."

          # 3. Relance de l'installeur sans option (cas d'un ancien raccourci vers WeCraft.exe) :
          #    il doit lancer l'appli déjà installée, vite, sans réinstaller.
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process $setup -PassThru
          if (-not $p.WaitForExit(30000)) { Fail "L'installeur relancé ne s'est pas arrêté en 30 s" }
          $sw.Stop()
          Start-Sleep 6
          $running = Get-Process -Name WeCraft -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $exe }
          if (-not $running) { Fail "L'installeur relancé n'a pas lancé l'application installée" }
          if ((Get-Item $exe).LastWriteTimeUtc -ne $stamp) { Fail "L'installeur relancé a réinstallé l'application" }
          Write-Host "Installeur relancé : appli lancée sans réinstallation, installeur fermé en $([math]::Round($sw.Elapsed.TotalSeconds, 1)) s."
          Stop-WeCraft

          # 4. Désinstallation silencieuse : appli et raccourcis retirés, réglages conservés
          $m = [regex]::Match($entry.UninstallString, '^"([^"]+)"')
          if (-not $m.Success) { Fail "Commande de désinstallation illisible : $($entry.UninstallString)" }
          Start-Process $m.Groups[1].Value -ArgumentList "/S", "/currentuser" -Wait
          $deadline = (Get-Date).AddSeconds(90)
          while ((Test-Path $exe) -and (Get-Date) -lt $deadline) { Start-Sleep 2 }
          if (Test-Path $exe) { Fail "Désinstallation : WeCraft.exe toujours présent" }
          if ((Test-Path $desktop) -or (Test-Path $menu)) { Fail "Désinstallation : raccourci restant" }

          # 5. Témoin : réglages WeCraft intacts après installation, démarrages et désinstallation
          if (-not (Test-Path $cfg)) { Fail "launcher_config.json a été supprimé" }
          if ((Get-FileHash $cfg).Hash -ne $cfgHash) { Fail "launcher_config.json a été modifié" }
          Write-Host "Désinstallation propre ; launcher_config.json intact."

      - uses: actions/upload-artifact@v4
        with:
          name: wecraft-electron-installeur
          retention-days: 14
          path: |
            electron/release/WeCraft-Setup.exe
            electron/release/WeCraft-Setup.exe.sha256
            electron/package-lock.json
