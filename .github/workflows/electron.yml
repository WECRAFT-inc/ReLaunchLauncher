name: Electron (compilation de contrôle)

# Lot E0 de la migration Electron : vérifie, compile et teste la version Electron sous Windows
# (installeur complet, par utilisateur, décision du 20/10/2026).
# RIEN n'est publié : pas de release, pas de secret, pas de signature. L'installeur produit est seulement
# joint au run (« artefact », 14 jours) pour être essayé en bac à sable.
on:
  push:
    branches: ["electron/**"]
  pull_request:
    paths: ["electron/**", ".github/workflows/electron.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Versions exactes et empreintes d'intégrité de package-lock.json (relu le 20/10/2026).
      - name: Dépendances (versions verrouillées)
        run: npm ci --no-audit --no-fund

      - name: Vérification des types (TypeScript strict)
        run: npm run typecheck

      - name: Tests (bloquants)
        run: npm test

      - name: Compilation de l'installeur (sans publication)
        run: npm run dist:win

      - name: Empreinte SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash release/ReLaunch.exe -Algorithm SHA256).Hash.ToLower()
          "$h  ReLaunch.exe" | Out-File release/ReLaunch.exe.sha256 -Encoding ascii
          Get-Item release/ReLaunch.exe | Select-Object Name, Length | Format-Table

      # Scénario complet sur la machine de la CI (jetable) : installation, raccourcis, démarrage,
      # relance de l'installeur comme le ferait un ancien raccourci, désinstallation.
      # Un faux launcher_config.json sert de témoin : il ne doit JAMAIS être modifié.
      - name: Installation, relance et désinstallation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Fail($msg) { Write-Error $msg; exit 1 }
          function Stop-ReLaunch { Get-Process -Name ReLaunch -ErrorAction SilentlyContinue | Stop-Process -Force; Start-Sleep 2 }

          $setup = (Resolve-Path release/ReLaunch.exe).Path
          $cfgDir = Join-Path $env:APPDATA ".wecraft"
          New-Item -ItemType Directory -Force $cfgDir | Out-Null
          $cfg = Join-Path $cfgDir "launcher_config.json"
          '{"theme": "glace", "temoin": "ne pas modifier"}' | Out-File $cfg -Encoding utf8
          $cfgHash = (Get-FileHash $cfg).Hash

          # 1. Installation silencieuse (par utilisateur, sans droits administrateur)
          $p = Start-Process $setup -ArgumentList "/S" -PassThru -Wait
          if ($p.ExitCode -ne 0) { Fail "Installation : code $($p.ExitCode)" }
          $entry = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" |
            Where-Object { $_.DisplayName -like "ReLaunch*" } | Select-Object -First 1
          if (-not $entry) { Fail "Aucune entrée de désinstallation trouvée (HKCU)" }
          $dir = $entry.InstallLocation
          if (-not $dir) { $dir = Join-Path $env:LOCALAPPDATA "Programs\ReLaunch" }
          $exe = Join-Path $dir "ReLaunch.exe"
          if (-not (Test-Path $exe)) { Fail "ReLaunch.exe absent de $dir" }
          if (-not $dir.StartsWith($env:LOCALAPPDATA)) { Fail "Installé hors du profil utilisateur : $dir" }
          $desktop = Join-Path ([Environment]::GetFolderPath("Desktop")) "ReLaunch.lnk"
          $menu = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\ReLaunch.lnk"
          if (-not (Test-Path $desktop)) { Fail "Raccourci Bureau absent" }
          if (-not (Test-Path $menu)) { Fail "Raccourci menu Démarrer absent" }
          $stamp = (Get-Item $exe).LastWriteTimeUtc
          Write-Host "Installé : $dir (version $($entry.DisplayVersion)) ; raccourcis Bureau et menu Démarrer présents."

          # 2. L'application installée démarre et reste ouverte
          Stop-ReLaunch
          $app = Start-Process $exe -PassThru
          Start-Sleep 12
          if ($app.HasExited) { Fail "L'application installée s'est arrêtée (code $($app.ExitCode))" }
          Stop-ReLaunch
          Write-Host "Application installée : démarrée, toujours ouverte après 12 s."

          # 2b. Lot E1 : réglages abîmés -> copie mise de côté au démarrage, original jamais modifié.
          #     APPDATA est redirigé pour l'appli seulement (bac à sable), puis rétabli.
          $realAppData = $env:APPDATA
          $bac = Join-Path $env:RUNNER_TEMP "bac-e1\AppData\Roaming"
          $bacCfgDir = Join-Path $bac ".wecraft"
          New-Item -ItemType Directory -Force $bacCfgDir | Out-Null
          $bacCfg = Join-Path $bacCfgDir "launcher_config.json"
          $broken = '{"theme": "glace", "fichier": "abime volontairement"'
          [IO.File]::WriteAllText($bacCfg, $broken)
          $env:APPDATA = $bac
          $app = Start-Process $exe -PassThru
          $env:APPDATA = $realAppData
          Start-Sleep 12
          if ($app.HasExited) { Fail "Réglages abîmés : l'application s'est arrêtée (code $($app.ExitCode))" }
          Stop-ReLaunch
          if ([IO.File]::ReadAllText($bacCfg) -ne $broken) { Fail "Réglages abîmés : l'original a été modifié" }
          $copies = @(Get-ChildItem $bacCfgDir -Filter "launcher_config.json.invalide-*")
          if ($copies.Count -ne 1) { Fail "Réglages abîmés : $($copies.Count) copie(s) au lieu d'une" }
          if ([IO.File]::ReadAllText($copies[0].FullName) -ne $broken) { Fail "Réglages abîmés : la copie diffère de l'original" }
          if ((Get-FileHash $cfg).Hash -ne $cfgHash) { Fail "Le vrai launcher_config.json a été touché pendant l'essai en bac à sable" }
          Write-Host "Réglages abîmés : copie $($copies[0].Name) créée, original intact, vrais réglages non touchés."

          # 3. Relance de l'installeur sans option (cas d'un ancien raccourci vers WeCraft.exe) :
          #    il doit lancer l'appli déjà installée, vite, sans réinstaller.
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process $setup -PassThru
          if (-not $p.WaitForExit(30000)) { Fail "L'installeur relancé ne s'est pas arrêté en 30 s" }
          $sw.Stop()
          Start-Sleep 6
          $running = Get-Process -Name ReLaunch -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $exe }
          if (-not $running) { Fail "L'installeur relancé n'a pas lancé l'application installée" }
          if ((Get-Item $exe).LastWriteTimeUtc -ne $stamp) { Fail "L'installeur relancé a réinstallé l'application" }
          Write-Host "Installeur relancé : appli lancée sans réinstallation, installeur fermé en $([math]::Round($sw.Elapsed.TotalSeconds, 1)) s."
          Stop-ReLaunch

          # 4. Désinstallation silencieuse : appli et raccourcis retirés, réglages conservés
          $m = [regex]::Match($entry.UninstallString, '^"([^"]+)"')
          if (-not $m.Success) { Fail "Commande de désinstallation illisible : $($entry.UninstallString)" }
          Start-Process $m.Groups[1].Value -ArgumentList "/S", "/currentuser" -Wait
          $deadline = (Get-Date).AddSeconds(90)
          while ((Test-Path $exe) -and (Get-Date) -lt $deadline) { Start-Sleep 2 }
          if (Test-Path $exe) { Fail "Désinstallation : ReLaunch.exe toujours présent" }
          if ((Test-Path $desktop) -or (Test-Path $menu)) { Fail "Désinstallation : raccourci restant" }

          # 5. Témoin : réglages WeCraft intacts après installation, démarrages et désinstallation
          if (-not (Test-Path $cfg)) { Fail "launcher_config.json a été supprimé" }
          if ((Get-FileHash $cfg).Hash -ne $cfgHash) { Fail "launcher_config.json a été modifié" }
          Write-Host "Désinstallation propre ; launcher_config.json intact."

      # Installeur de test (~110 Mo) gardé 2 jours seulement : le quota de stockage du compte est limité.
      # Un quota plein n'est pas une erreur du code : l'envoi peut échouer sans faire échouer la vérification.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: relaunch-installeur
          retention-days: 2
          path: |
            electron/release/ReLaunch.exe
            electron/release/ReLaunch.exe.sha256

  # Lot E3 : installation RÉELLE depuis les serveurs officiels (Mojang, Fabric, Quilt, Forge, NeoForge),
  # avec le Java de Mojang, dans un dossier jetable de la machine de CI. Aucune publication, aucun secret.
  installation-reelle:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Dépendances (versions verrouillées)
        run: npm ci --no-audit --no-fund
      - name: Compilation
        run: npm run build
      - name: Installation réelle (dossier jetable)
        run: node scripts/e2e-install.mjs
      - name: Modpack Modrinth réel (dossier jetable)
        run: node scripts/e2e-modrinth.mjs
