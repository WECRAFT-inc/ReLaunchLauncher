name: Electron (compilation de contrôle)

# Lot E0 de la migration Electron : vérifie, compile et teste la version Electron sous Windows.
# RIEN n'est publié : pas de release, pas de secret, pas de signature. L'exe produit est seulement
# joint au run (« artefact », 14 jours) pour être essayé en bac à sable.
on:
  push:
    branches: ["electron/**"]
  pull_request:
    paths: ["electron/**", ".github/workflows/electron.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Pas encore de package-lock.json : il est produit ici et joint au run, pour être relu puis
      # versionné. Ensuite, cette étape passera à « npm ci » (versions exactes et empreintes).
      - name: Dépendances
        run: npm install --no-audit --no-fund

      - name: Vérification des types (TypeScript strict)
        run: npm run typecheck

      - name: Tests (bloquants)
        run: npm test

      - name: Compilation de l'exe portable (sans publication)
        run: npm run dist:win

      - name: Empreinte SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash release/WeCraft.exe -Algorithm SHA256).Hash.ToLower()
          "$h  WeCraft.exe" | Out-File release/WeCraft.exe.sha256 -Encoding ascii
          Get-Item release/WeCraft.exe | Select-Object Name, Length | Format-Table

      - name: Démarrage de l'application (essai de 15 s, données isolées)
        shell: pwsh
        run: |
          # APPDATA redirigé vers un dossier vide : l'essai ne lit aucun réglage existant.
          $sandbox = Join-Path $env:RUNNER_TEMP "wecraft-essai"
          New-Item -ItemType Directory -Force $sandbox | Out-Null
          $env:APPDATA = $sandbox
          $p = Start-Process release/win-unpacked/WeCraft.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { Write-Error "WeCraft s'est arrêté au démarrage (code $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id -Force
          Write-Host "WeCraft tournait toujours après 15 s."

      # Diagnostic de la lenteur au démarrage (15 s mesurées sur le PC du développeur, 19/10/2026) :
      # mêmes fichiers, trois formes à comparer. Temporaire : sera retiré une fois le format choisi.
      - name: Variantes de comparaison (sans compression, dossier non compressé)
        shell: pwsh
        run: |
          # Arguments entre guillemets : sinon PowerShell coupe « -c.compression=store » au niveau du point.
          npx electron-builder --win portable --x64 --publish never "-c.compression=store" "-c.portable.artifactName=WeCraft-sans-compression.exe" "-c.directories.output=release-store"
          if ($LASTEXITCODE -ne 0) { Write-Error "Variante sans compression : échec (code $LASTEXITCODE)"; exit 1 }
          Compress-Archive -Path release/win-unpacked/* -DestinationPath release/WeCraft-dossier.zip
          foreach ($f in "release/WeCraft.exe", "release-store/WeCraft-sans-compression.exe", "release/WeCraft-dossier.zip") {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            $i = Get-Item $f
            "$h  $($i.Name)  $([math]::Round($i.Length / 1MB)) Mo" | Tee-Object -Append release/EMPREINTES.txt
          }

      - uses: actions/upload-artifact@v4
        with:
          name: wecraft-electron-e0
          retention-days: 14
          path: |
            electron/release/WeCraft.exe
            electron/release/WeCraft.exe.sha256
            electron/release/WeCraft-dossier.zip
            electron/release/EMPREINTES.txt
            electron/release-store/WeCraft-sans-compression.exe
            electron/package-lock.json
